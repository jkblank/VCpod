[project]
name = "fetch-scheduler"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "common",
    "music-stack-cli",
]

[project.scripts]
fetch-scheduler = "fetch_scheduler.cli:main"

[tool.uv.sources]
common = { workspace = true }
music-stack-cli = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fetch_scheduler"]
