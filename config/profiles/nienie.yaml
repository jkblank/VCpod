profile: nienie
device:
  # Real Apple product serial (SCSI VPD page 0x80), read live via
  # `iopenpod --linux-identity-status` while connected and labeled
  # "NIENIE'S IP" (2026-08-21). Requires iopenpod's own udev rule
  # (61-iopenpod.rules) to be installed on this host so `enrich()` can
  # read it without root.
  match_by: serial
  match_value: "8K6382K4V9S"

# Profile-default fetch schedule (cron expression) — mirrors john.yaml's
# own schedule. Sundays at 23:55.
fetch:
  schedule: "55 23 * * 0"

# The 4 playlists requested for this profile, copied from john.yaml.
playlists:
  - name: "Inspired Chill"
    source: apple_music
    source_id: pl.d838ab1729e94005ab6d16d090580d26
  - name: "Rise Up"
    source: apple_music
    source_id: "pl.20f46341ada44a549c7c56118e642cb8"
  - name: "Songs to vape to"
    source: apple_music
    source_id: "pl.u-76oNPJyt4GgLYa"
  - name: "Every1"
    source: apple_music
    source_id: "pl.c0e10ea6fb314301801a4c45ce498f77"

# Podcasts intentionally disabled for this profile — shows: [] means the
# fetch step subscribes to/downloads nothing for nienie. credentials_file/
# sync_unplayed_only/episode_filter/max_episodes_per_show are still
# required by the schema even though nothing will ever be selected (same
# pattern as john-copy.yaml).
podcasts:
  pocketcasts:
    credentials_file: /config/secrets/pocketcasts/john.json
  sync_unplayed_only: true
  episode_filter: archived
  max_episodes_per_show: 5
  shows: []

# Audiobooks intentionally excluded — only the 4 playlists above were
# requested. AudiobooksConfig has no direct "sync nothing" mode
# (omitted/null defaults to "sync everything"), so this excludes every
# author currently under library/audiobooks by name instead (same
# pattern as john-copy.yaml/testbed.yaml). Update this list if new
# audiobooks get added and should also stay off this device.
audiobooks:
  mode: exclude
  selections:
    - "Franz Kafka"
    - "George Orwell"
    - "Marcus Aurelius"
    - "Neil Postman"

sync:
  trigger: on_connect
  transcode_format: aac
  push_play_status_back: false
