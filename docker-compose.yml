# Fetchers are gated behind Compose profiles, one per music source
# (matching config/global.yaml's sources.*.enabled flags), so a
# household that only uses e.g. Apple Music doesn't have to build/run
# containers for sources it doesn't use — or for Spotify/YouTube Music
# right now, whose downloads are both currently blocked on
# platform-side requirements (see notes.md), not just "unused".
# Activate one or more with `docker compose --profile apple up` or by
# setting COMPOSE_PROFILES in .env (see .env.example). library-manager
# and podcast-manager have no profile, so they're always included —
# every profile needs dedup/tagging, and podcasts.* is a required part
# of the profile schema today, not optional per-household like a music
# source is. audiobook-manager has its own "audiobooks" profile instead
# (`docker compose --profile audiobooks up`) — it's a manual, per-book CLI
# tool, not something every profile needs by default, and it pulls in a
# genuinely heavier dependency tree (beets).
services:
  fetcher-apple:
    profiles: ["apple"]
    build:
      context: .
      dockerfile: services/fetcher-apple/Dockerfile
    env_file: .env
    volumes:
      - ./config:/config:ro
      - ./library:/data/library
      - ./state:/data/state

  fetcher-spotify:
    profiles: ["spotify"]
    build:
      context: .
      dockerfile: services/fetcher-spotify/Dockerfile
    env_file: .env
    volumes:
      - ./config:/config:ro
      - ./library:/data/library
      - ./state:/data/state

  fetcher-ytmusic:
    profiles: ["ytmusic"]
    build:
      context: .
      dockerfile: services/fetcher-ytmusic/Dockerfile
    env_file: .env
    volumes:
      - ./config:/config:ro
      - ./library:/data/library
      - ./state:/data/state

  library-manager:
    build:
      context: .
      dockerfile: services/library-manager/Dockerfile
    env_file: .env
    volumes:
      - ./config:/config:ro
      - ./library:/data/library
      - ./state:/data/state

  podcast-manager:
    build:
      context: .
      dockerfile: services/podcast-manager/Dockerfile
    env_file: .env
    volumes:
      - ./config:/config:ro
      - ./library:/data/library
      - ./state:/data/state

  # M15: manual audiobook import (merge MP3 parts -> tagged .m4b via
  # beets-audible). Gated behind its own profile, unlike library-manager/
  # podcast-manager above — it pulls in beets' full dependency tree
  # (numpy/scipy/numba/llvmlite, unconditional base deps of beets 2.12,
  # confirmed real weight not just an extras-gated nicety) and does live
  # Audnex/Audible network lookups, so most households shouldn't have to
  # build it. No config/ mount: fully flag-driven CLI, not profile-driven.
  audiobook-manager:
    profiles: ["audiobooks"]
    build:
      context: .
      dockerfile: services/audiobook-manager/Dockerfile
    volumes:
      - ./library:/data/library
      - ./state:/data/state

  # M9: keeps library/ fresh on each playlist's/show's configured
  # fetch_schedule (see music-stack-planning.md), independently of whether
  # any iPod is connected — the first long-running/restart:-bearing
  # service in this file; every other service above is one-shot.
  # sync-orchestrator's udev-triggered auto-sync (bare metal, see its own
  # README) never fetches itself; it only ever writes whatever this
  # service has already pulled in, except for a short opportunistic
  # pre-fetch window right before a scheduled fetch would happen anyway.
  fetch-scheduler:
    build:
      context: .
      dockerfile: services/fetch-scheduler/Dockerfile
    env_file: .env
    restart: unless-stopped
    command: ["--config-root", "/config", "--library-root", "/data/library", "--state-root", "/data/state"]
    volumes:
      - ./config:/config:ro
      - ./library:/data/library
      - ./state:/data/state

  # M11-M14: web GUI (config editor + Overview/Activity monitoring +
  # on-demand device sync). Unlike every service above, this one needs
  # real, privileged access to the iPod's block device and mount --
  # its Sync screen shells out to a full sync-orchestrator install baked
  # into its own image (services/web-gui-backend/Dockerfile vendors it
  # as a second, independent uv project, same isolation reasoning as the
  # bare-metal case) for "identify device"/"compute plan"/"execute",
  # hitting the exact iopenpod device layer notes.md's "Distribution: why
  # sync-orchestrator isn't containerized too" entry already covers.
  # config is mounted read-write here (unlike the :ro mounts above) —
  # this is the one service that actually edits profiles/global.yaml and
  # saves credential files, not just reads them.
  #
  # The udev-triggered *unattended* auto-sync-on-connect (this screen's
  # own "Set up auto-sync" generates the systemd unit + udev rule text,
  # `/api/auto-sync/setup`) is deliberately NOT this container — it's a
  # genuinely separate bare-metal install on the host, using this same
  # checkout's services/sync-orchestrator directly, and keeps working
  # whether or not this container is even running. See
  # services/sync-orchestrator/README.md.
  web-gui-backend:
    build:
      context: .
      dockerfile: services/web-gui-backend/Dockerfile
    env_file: .env
    restart: unless-stopped
    privileged: true
    command:
      - "--host=0.0.0.0"
      - "--config-root=/config"
      - "--library-root=/data/library"
      - "--state-root=/data/state"
    ports:
      - "${WEB_GUI_PORT:-8420}:8420"
    volumes:
      - ./config:/config
      - ./library:/data/library
      - ./state:/data/state
      # Real block-device nodes -- lsblk/eject/iopenpod's own device
      # enrichment all read these directly. privileged: true (above)
      # relaxes the device cgroup; this makes sure the nodes themselves
      # are actually present inside the container's own /dev.
      - /dev:/dev
      # Lets sync-orchestrator's best-effort `udisksctl mount`
      # (device.py's mount_candidate_devices) reach the *host's* udisks2
      # daemon, instead of needing one running inside this container.
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      # Wherever this host actually auto-mounts removable media --
      # rslave propagation means a device mounted on the host *after*
      # this container starts still shows up in here (needed for a
      # freshly-plugged-in iPod to be found without a container restart).
      # Adjust HOST_MEDIA_ROOT in .env if your distro doesn't auto-mount
      # under /run/media (Debian/Ubuntu typically use /media/$USER).
      - type: bind
        source: ${HOST_MEDIA_ROOT:-/run/media}
        target: ${HOST_MEDIA_ROOT:-/run/media}
        bind:
          propagation: rslave

# sync-orchestrator itself is intentionally not its own top-level service
# here — it needs direct USB access to the iPod and runs bare metal (its
# own systemd unit + udev rule, generated by the Sync screen above, or
# see services/sync-orchestrator/README.md for the manual steps). It's
# vendored *inside* web-gui-backend's image above for that container's
# own on-demand use, which is a separate concern from the bare-metal
# unattended auto-sync install.
